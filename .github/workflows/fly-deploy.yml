# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    name: Test and deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - name: Build patched image
        run: docker build --pull -t blackantmedia:php84-security .
      - name: Check PHP syntax
        run: docker run --rm blackantmedia:php84-security sh -c 'find . -name "*.php" -print0 | xargs -0 -n1 php -l'
      - name: Test Markdown
        run: docker run --rm -v "$PWD/tests:/tests:ro" blackantmedia:php84-security php /tests/markdown.php
      - name: Test HTTP routes
        run: |
          docker run -d --name blackantmedia-test -p 127.0.0.1:8087:80 blackantmedia:php84-security
          curl --retry 10 --retry-all-errors --retry-delay 1 --max-time 10 --fail --silent --show-error --output /dev/null http://127.0.0.1:8087/
          python3 tests/smoke.py http://127.0.0.1:8087
      - name: Show container logs
        if: always()
        run: docker logs blackantmedia-test || true
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: github.event_name == 'push'
      - run: flyctl deploy --remote-only
        if: github.event_name == 'push'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify live routes
        if: github.event_name == 'push'
        run: python3 tests/smoke.py https://blackantmedia.fly.dev
